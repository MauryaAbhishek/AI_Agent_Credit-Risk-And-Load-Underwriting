services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credit_risk
      POSTGRES_USER: credit_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_app -d credit_risk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: postgresql+psycopg://credit_app:${POSTGRES_PASSWORD}@db:5432/credit_risk
      CHROMA_PATH: /app/data/chroma
      POLICY_COLLECTION: underwriting_policies
      POLICY_VERSION: ${POLICY_VERSION:-demo-policy-v1}
      LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
